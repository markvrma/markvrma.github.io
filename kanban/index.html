<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kanban</title>
<meta name="theme-color" content="#2b1a8a">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kanban">
<script>
/* icon + manifest live inside this file so the whole app stays one downloadable html.
   both get built at load and attached as data urls. */
(function () {
  const icon =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">' +
    '<rect width="16" height="16" fill="#1a7a7a"/>' +
    '<rect x="1" y="1" width="14" height="14" fill="#c8c4bc"/>' +
    '<rect x="1" y="1" width="14" height="3" fill="#2b1a8a"/>' +
    '<rect x="3" y="6" width="3" height="7" fill="#e02020"/>' +
    '<rect x="7" y="6" width="3" height="5" fill="#f0a000"/>' +
    '<rect x="11" y="6" width="2" height="3" fill="#20a850"/>' +
    '<path d="M0 0h16v1H0zM0 15h16v1H0zM0 0h1v16H0zM15 0h1v16h-1z" fill="#12101a"/>' +
    '</svg>'
  const iconUrl = "data:image/svg+xml," + encodeURIComponent(icon);
  // absolute urls, not "." — the manifest itself is a data: url so a relative start_url
  // has no sane base to resolve against and the installed app ends up pointing nowhere
  const here = location.protocol.startsWith("http") ? location.href.split(/[?#]/)[0] : ".";
  const dir = here === "." ? "." : new URL("./", here).href;
  const manifest = {
    name: "kanban", short_name: "kanban", description: "boards, columns, tasks",
    start_url: here, scope: dir, display: "standalone", orientation: "any",
    background_color: "#1a7a7a", theme_color: "#2b1a8a",
    icons: [
      { src: iconUrl, sizes: "any", type: "image/svg+xml", purpose: "any" },
      { src: iconUrl, sizes: "any", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const add = (rel, href, type) => {
    const l = document.createElement("link");
    l.rel = rel; l.href = href;
    if (type) l.type = type;
    document.head.appendChild(l);
  };
  add("icon", iconUrl, "image/svg+xml");
  add("apple-touch-icon", iconUrl);
  add("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));
})();
</script>
<style>
  /* 16 bit console meets a 2001 desktop. chunky bevels, hard shadows, no curves. */
  :root{
    --desk:#1a7a7a; --panel:#c8c4bc; --panel-hi:#ffffff; --panel-lo:#5a5650;
    --ink:#12101a; --title-a:#2b1a8a; --title-b:#5b3fd6; --accent:#ff2f8e;
    --high:#e02020; --medium:#f0a000; --low:#20a850; --paper:#eae6dc;
    --font:"Courier New","Lucida Console",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{
    font:14px/1.4 var(--font); color:var(--ink); letter-spacing:.02em;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px),
      radial-gradient(circle at 50% 0%, #2aa0a0 0%, var(--desk) 60%, #0d4a4a 100%);
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:none; image-rendering:pixelated;
  }
  /* crt scanlines, purely decorative so it must never eat a tap */
  body::after{
    content:""; position:fixed; inset:0; z-index:99; pointer-events:none; opacity:.16;
    background:repeating-linear-gradient(to bottom, #000 0 2px, transparent 2px 6px);
  }
  .bevel{
    background:var(--panel);
    border:3px solid var(--ink);
    box-shadow:inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 5px 5px 0 rgba(0,0,0,.55);
  }

  header{position:sticky; top:0; z-index:20; padding:env(safe-area-inset-top) 8px 0}
  .bar{
    display:flex; align-items:center; gap:8px; padding:6px 8px; margin-top:8px;
    background:linear-gradient(90deg,var(--title-a),var(--title-b));
    border:3px solid var(--ink); border-bottom:none; color:#fff;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.35), 5px 0 0 rgba(0,0,0,.55);
  }
  .bar h1{
    font:700 15px/1 var(--font); margin:0; text-transform:uppercase; letter-spacing:.12em;
    text-shadow:2px 2px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .bar h1::before{content:"\25B6 "; color:#ffe14d}
  .bar .spacer{flex:1}
  .icon-btn{
    background:var(--panel); border:2px solid var(--ink); color:var(--ink);
    box-shadow:inset 1px 1px 0 var(--panel-hi), inset -1px -1px 0 var(--panel-lo);
    width:30px; height:26px; font:700 14px/1 var(--font); cursor:pointer;
  }
  .icon-btn:active{box-shadow:inset -1px -1px 0 var(--panel-hi), inset 1px 1px 0 var(--panel-lo); transform:translate(1px,1px)}

  .boards{
    display:flex; gap:6px; overflow-x:auto; padding:8px; scrollbar-width:none;
    background:var(--panel); border:3px solid var(--ink); border-top:none;
    box-shadow:inset 2px 0 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 5px 5px 0 rgba(0,0,0,.55);
  }
  .boards::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 12px; border:2px solid var(--ink); background:var(--panel);
    box-shadow:inset 1px 1px 0 var(--panel-hi), inset -1px -1px 0 var(--panel-lo);
    font:700 12px/1 var(--font); text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink); cursor:pointer;
  }
  .chip.on{
    background:var(--title-b); color:#fff; text-shadow:1px 1px 0 #000;
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.4), inset -1px -1px 0 rgba(0,0,0,.5);
  }
  .chip.on::before{content:"\25C6 "; color:#ffe14d; animation:blink 1s step-end infinite}
  .chip.add{color:var(--title-a)}
  @keyframes blink{50%{opacity:0}}
  .warn{
    margin:8px 0 0; padding:8px 10px; background:var(--high); color:#fff; font-size:12px;
    border:3px solid var(--ink); text-transform:uppercase; text-shadow:1px 1px 0 #000;
  }

  main{padding:14px 8px 110px; display:grid; gap:16px}
  @media (min-width:820px){ main{grid-template-columns:repeat(3,1fr); align-items:start} }

  .col{
    background:var(--panel); border:3px solid var(--ink); padding:0 10px 10px;
    box-shadow:inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 6px 6px 0 rgba(0,0,0,.55);
  }
  .col.over{background:#e8e2b0}
  .col.over h2{background:linear-gradient(90deg,var(--accent),#ff8ac4)}
  .col h2{
    display:flex; align-items:center; gap:8px; margin:0 -10px 10px; padding:6px 10px;
    background:linear-gradient(90deg,var(--title-a),var(--title-b));
    font:700 12px/1.2 var(--font); letter-spacing:.14em; text-transform:uppercase;
    color:#fff; text-shadow:2px 2px 0 #000; border-bottom:3px solid var(--ink);
  }
  .count{
    background:#ffe14d; color:#000; border:2px solid var(--ink); padding:1px 6px;
    font-size:11px; font-weight:700; text-shadow:none; margin-left:auto;
  }
  .empty{
    color:#5a5650; font-size:12px; padding:14px 6px; text-transform:uppercase;
    letter-spacing:.1em; text-align:center; border:2px dashed #8a857c;
  }

  .card{
    display:flex; gap:8px; align-items:flex-start; margin-bottom:10px; padding:8px;
    background:var(--paper); border:3px solid var(--ink); border-left:10px solid var(--pri);
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  .card[data-pri=high]{--pri:var(--high)}
  .card[data-pri=medium]{--pri:var(--medium)}
  .card[data-pri=low]{--pri:var(--low)}
  .card .body{flex:1; min-width:0; cursor:pointer}
  .card .title{word-wrap:break-word; font-size:13px; font-weight:700}
  .tag{
    display:inline-block; margin-top:6px; padding:2px 6px; font-size:10px; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; color:#fff; text-shadow:1px 1px 0 #000;
    background:var(--pri); border:2px solid var(--ink);
  }
  .handle{
    touch-action:none; cursor:grab; padding:2px 3px; font-size:13px; line-height:1;
    color:#5a5650; user-select:none; -webkit-user-select:none;
  }
  .moves{display:flex; flex-direction:column; gap:5px}
  .moves button{
    width:28px; height:24px; background:var(--panel); border:2px solid var(--ink);
    box-shadow:inset 1px 1px 0 var(--panel-hi), inset -1px -1px 0 var(--panel-lo);
    font:700 12px/1 var(--font); color:var(--ink); cursor:pointer;
  }
  .moves button:active{transform:translate(1px,1px)}
  .moves button:disabled{opacity:.35; box-shadow:none}
  .ghost{position:fixed; z-index:60; pointer-events:none; width:var(--w); transform:rotate(-2deg)}
  .dragging{opacity:.35}

  .fab{
    position:fixed; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:30;
    padding:12px 16px; background:var(--accent); color:#fff; border:3px solid var(--ink);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.45), inset -2px -2px 0 rgba(0,0,0,.35), 5px 5px 0 rgba(0,0,0,.55);
    font:700 14px/1 var(--font); letter-spacing:.1em; text-transform:uppercase;
    text-shadow:2px 2px 0 #000; cursor:pointer;
  }
  .fab:active{transform:translate(2px,2px); box-shadow:inset 2px 2px 0 rgba(255,255,255,.45), inset -2px -2px 0 rgba(0,0,0,.35), 3px 3px 0 rgba(0,0,0,.55)}

  dialog{
    border:3px solid var(--ink); padding:0; width:100%; max-width:440px; margin:auto auto 0;
    background:var(--panel); color:var(--ink); font-family:var(--font);
    box-shadow:inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 8px 8px 0 rgba(0,0,0,.55);
  }
  @media (min-width:560px){ dialog{margin:auto} }
  dialog::backdrop{background:rgba(10,30,30,.7)}
  form{padding:0 14px calc(16px + env(safe-area-inset-bottom)); display:grid; gap:12px}
  form h3{
    margin:0 -14px 4px; padding:6px 12px;
    background:linear-gradient(90deg,var(--title-a),var(--title-b));
    font:700 13px/1.3 var(--font); letter-spacing:.12em; text-transform:uppercase;
    color:#fff; text-shadow:2px 2px 0 #000; border-bottom:3px solid var(--ink);
  }
  form h3::before{content:"\25A0 "; color:#ffe14d}
  label{
    display:block; margin-bottom:5px; font:700 11px/1 var(--font); letter-spacing:.14em;
    text-transform:uppercase; color:#3a3630;
  }
  input[type=text],select{
    width:100%; padding:10px; font:14px/1 var(--font); color:var(--ink);
    background:var(--paper); border:2px solid var(--ink);
    box-shadow:inset 2px 2px 0 rgba(0,0,0,.25);
  }
  input[type=text]:focus,select:focus{outline:3px solid var(--accent); outline-offset:1px}
  .seg{display:flex; gap:6px}
  .seg button,.row button,.danger{
    background:var(--panel); border:2px solid var(--ink); color:var(--ink); cursor:pointer;
    box-shadow:inset 1px 1px 0 var(--panel-hi), inset -1px -1px 0 var(--panel-lo);
    font:700 12px/1 var(--font); letter-spacing:.1em; text-transform:uppercase;
  }
  /* min-width 0 or the uppercase labels refuse to shrink and blow the dialog wider
     than a phone screen, which hides the save button */
  .seg button{flex:1; min-width:0; padding:10px 2px; letter-spacing:.06em}
  .seg button.on{color:#fff; text-shadow:1px 1px 0 #000}
  .seg button.on[data-v=high]{background:var(--high)}
  .seg button.on[data-v=medium]{background:var(--medium)}
  .seg button.on[data-v=low]{background:var(--low)}
  .row{display:flex; gap:8px}
  .row button{flex:1; min-width:0; padding:12px 4px}
  .primary{background:var(--title-b); color:#fff; text-shadow:1px 1px 0 #000}
  .danger{width:100%; padding:10px; background:var(--high); color:#fff; text-shadow:1px 1px 0 #000}
  .seg button:active,.row button:active,.danger:active{transform:translate(1px,1px)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="boardTitle">kanban</h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="boardMenu" title="board options">&#8942;</button>
  </div>
  <div class="boards" id="boardBar"></div>
</header>

<main id="cols"></main>
<button class="fab" id="fab" aria-label="new task">+ new</button>

<dialog id="taskSheet">
  <form method="dialog" id="taskForm">
    <h3 id="taskHeading">new task</h3>
    <div>
      <label for="title">title</label>
      <input type="text" id="title" autocomplete="off" placeholder="what needs doing" required>
    </div>
    <div>
      <label>priority</label>
      <div class="seg" id="priSeg">
        <button type="button" data-v="high">high</button>
        <button type="button" data-v="medium">medium</button>
        <button type="button" data-v="low">low</button>
      </div>
    </div>
    <div>
      <label for="status">column</label>
      <select id="status"></select>
    </div>
    <div class="row">
      <button type="button" class="ghost-btn" id="taskCancel">cancel</button>
      <button type="button" class="primary" id="taskSave">save</button>
    </div>
    <button type="button" class="danger" id="taskDelete" style="display:none">delete task</button>
  </form>
</dialog>

<dialog id="boardSheet">
  <form method="dialog">
    <h3 id="boardHeading">board</h3>
    <div>
      <label for="boardName">name</label>
      <input type="text" id="boardName" autocomplete="off" placeholder="work" required>
    </div>
    <div class="row">
      <button type="button" class="ghost-btn" id="boardCancel">cancel</button>
      <button type="button" class="primary" id="boardSave">save</button>
    </div>
    <button type="button" class="danger" id="boardDelete" style="display:none">delete board</button>
    <div>
      <label>backup</label>
      <div class="row">
        <button type="button" class="ghost-btn" id="exportBtn">export json</button>
        <button type="button" class="ghost-btn" id="importBtn">import json</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </form>
</dialog>

<script>
const COLS = [["inprogress","In Progress"],["todo","To Do"],["done","Done"]];
const KEY = "kanban.v1";
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => s.replace(/[&<>"']/g, c => ("&#" + c.charCodeAt(0) + ";"));

const seed = () => ({
  active: "personal",
  boards: [
    { id: "personal", name: "Personal", tasks: [] },
    { id: uid(), name: "Work", tasks: [] },
    { id: uid(), name: "Chores", tasks: [] }
  ]
});

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.boards) && s.boards.length) return s;
    }
  } catch (e) { /* corrupt storage, start clean */ }
  return seed();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    // some browsers block storage on file:// or in private mode. keep working in
    // memory and say so once, so nobody loses a board thinking it was saved
    if (!save.warned) {
      save.warned = true;
      const bar = document.createElement("p");
      bar.className = "warn";
      bar.textContent = "this browser will not save to disk here, changes vanish on reload. export a backup.";
      document.querySelector("header").appendChild(bar);
    }
  }
}
function board() { return state.boards.find(b => b.id === state.active) || state.boards[0]; }

const boardBar = $("#boardBar"), cols = $("#cols");

function render() {
  const b = board();
  state.active = b.id;
  $("#boardTitle").textContent = b.name;
  boardBar.innerHTML =
    state.boards.map(x =>
      '<button class="chip' + (x.id === b.id ? ' on' : '') + '" data-board="' + x.id + '">' +
      esc(x.name) + '</button>').join('') +
    '<button class="chip add" data-new-board="1">+ board</button>';

  cols.innerHTML = COLS.map(function (pair, i) {
    const id = pair[0], label = pair[1];
    const list = b.tasks.filter(t => t.status === id);
    const cards = list.map(t =>
      '<article class="card" data-id="' + t.id + '" data-pri="' + t.priority + '">' +
        '<span class="handle" data-drag="' + t.id + '">&#8942;&#8942;</span>' +
        '<div class="body" data-edit="' + t.id + '">' +
          '<div class="title">' + esc(t.title) + '</div>' +
          '<span class="tag">' + t.priority + '</span>' +
        '</div>' +
        '<div class="moves">' +
          '<button data-move="' + t.id + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>&#9668;</button>' +
          '<button data-move="' + t.id + '" data-dir="1"' + (i === COLS.length - 1 ? ' disabled' : '') + '>&#9658;</button>' +
        '</div>' +
      '</article>').join('');
    return '<section class="col" data-col="' + id + '">' +
      '<h2>' + label + '<span class="count">' + list.length + '</span></h2>' +
      (cards || '<p class="empty">nothing here yet</p>') +
      '</section>';
  }).join('');
  save();
}

/* ---------- task crud ---------- */
const taskSheet = $("#taskSheet"), statusSel = $("#status");
statusSel.innerHTML = COLS.map(p => '<option value="' + p[0] + '">' + p[1] + '</option>').join('');
let editingId = null, priority = "medium";

function setPriority(v) {
  priority = v;
  Array.from($("#priSeg").children).forEach(btn => btn.classList.toggle("on", btn.dataset.v === v));
}
$("#priSeg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-v]");
  if (btn) setPriority(btn.dataset.v);
});

function openTask(id, statusHint) {
  editingId = id || null;
  const t = id ? board().tasks.find(x => x.id === id) : null;
  $("#taskHeading").textContent = t ? "edit task" : "new task";
  $("#title").value = t ? t.title : "";
  setPriority(t ? t.priority : "medium");
  statusSel.value = t ? t.status : (statusHint || "todo");
  $("#taskDelete").style.display = t ? "block" : "none";
  taskSheet.showModal();
  if (!t) $("#title").focus();
}

$("#taskSave").addEventListener("click", () => {
  const title = $("#title").value.trim();
  if (!title) { $("#title").focus(); return; }
  const b = board();
  if (editingId) {
    const t = b.tasks.find(x => x.id === editingId);
    t.title = title; t.priority = priority; t.status = statusSel.value;
  } else {
    b.tasks.push({ id: uid(), title: title, priority: priority, status: statusSel.value });
  }
  taskSheet.close(); render();
});
$("#taskDelete").addEventListener("click", () => {
  const b = board();
  b.tasks = b.tasks.filter(t => t.id !== editingId);
  taskSheet.close(); render();
});
$("#taskCancel").addEventListener("click", () => taskSheet.close());
$("#fab").addEventListener("click", () => openTask(null, "todo"));

cols.addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) return openTask(edit.dataset.edit);
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const t = board().tasks.find(x => x.id === mv.dataset.move);
    const at = COLS.findIndex(p => p[0] === t.status) + Number(mv.dataset.dir);
    if (COLS[at]) { t.status = COLS[at][0]; render(); }
  }
});

/* ---------- boards ---------- */
const boardSheet = $("#boardSheet");
let editingBoard = null;

function openBoard(id) {
  editingBoard = id || null;
  const b = id ? state.boards.find(x => x.id === id) : null;
  $("#boardHeading").textContent = b ? "edit board" : "new board";
  $("#boardName").value = b ? b.name : "";
  $("#boardDelete").style.display = b && state.boards.length > 1 ? "block" : "none";
  boardSheet.showModal();
  if (!b) $("#boardName").focus();
}
$("#boardSave").addEventListener("click", () => {
  const name = $("#boardName").value.trim();
  if (!name) { $("#boardName").focus(); return; }
  if (editingBoard) {
    state.boards.find(b => b.id === editingBoard).name = name;
  } else {
    const b = { id: uid(), name: name, tasks: [] };
    state.boards.push(b); state.active = b.id;
  }
  boardSheet.close(); render();
});
$("#boardDelete").addEventListener("click", () => {
  state.boards = state.boards.filter(b => b.id !== editingBoard);
  if (state.active === editingBoard) state.active = state.boards[0].id;
  boardSheet.close(); render();
});
$("#boardCancel").addEventListener("click", () => boardSheet.close());

$("#exportBtn").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "kanban-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || !Array.isArray(s.boards) || !s.boards.length) throw new Error("no boards in that file");
      state = s;
      if (!state.boards.some(b => b.id === state.active)) state.active = state.boards[0].id;
      boardSheet.close();
      render();
    } catch (err) {
      alert("could not read that file: " + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});
$("#boardMenu").addEventListener("click", () => openBoard(state.active));
boardBar.addEventListener("click", e => {
  const chip = e.target.closest("[data-board]");
  if (chip) { state.active = chip.dataset.board; return render(); }
  if (e.target.closest("[data-new-board]")) openBoard(null);
});

/* ---------- drag, pointer events so touch and mouse take the same path ---------- */
let drag = null;

cols.addEventListener("pointerdown", e => {
  const handle = e.target.closest("[data-drag]");
  if (!handle) return;
  const card = handle.closest(".card");
  const box = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.className = "card ghost";
  ghost.style.setProperty("--w", box.width + "px");
  ghost.style.left = box.left + "px";
  ghost.style.top = box.top + "px";
  document.body.appendChild(ghost);
  card.classList.add("dragging");
  drag = { id: handle.dataset.drag, ghost: ghost, card: card, dx: e.clientX - box.left, dy: e.clientY - box.top };
  handle.setPointerCapture(e.pointerId);
  e.preventDefault();
});

cols.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + "px";
  drag.ghost.style.top = (e.clientY - drag.dy) + "px";
  drag.ghost.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.ghost.style.display = "";
  const col = under && under.closest ? under.closest(".col") : null;
  document.querySelectorAll(".col").forEach(c => c.classList.toggle("over", c === col));
  drag.target = col;
});

function endDrag() {
  if (!drag) return;
  const t = board().tasks.find(x => x.id === drag.id);
  if (drag.target && t) t.status = drag.target.dataset.col;
  drag.ghost.remove();
  drag.card.classList.remove("dragging");
  document.querySelectorAll(".col").forEach(c => c.classList.remove("over"));
  drag = null;
  render();
}
cols.addEventListener("pointerup", endDrag);
cols.addEventListener("pointercancel", endDrag);

render();

// sw.js only exists when the folder is served. on file:// this is skipped, the app still
// works, it just cannot be installed as a standalone app from there
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
