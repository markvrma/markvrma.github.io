<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kanban</title>
<meta name="theme-color" content="#111318">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kanban">
<script>
/* icon + manifest live inside this file so the whole app stays one downloadable html.
   both get built at load and attached as data urls. */
(function () {
  const icon =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
    '<rect width="192" height="192" rx="42" fill="#2f6fed"/>' +
    '<rect x="34" y="46" width="34" height="100" rx="9" fill="#ffffff" opacity=".95"/>' +
    '<rect x="79" y="46" width="34" height="72" rx="9" fill="#ffffff" opacity=".8"/>' +
    '<rect x="124" y="46" width="34" height="46" rx="9" fill="#ffffff" opacity=".62"/>' +
    '</svg>';
  const iconUrl = "data:image/svg+xml," + encodeURIComponent(icon);
  // absolute urls, not "." — the manifest itself is a data: url so a relative start_url
  // has no sane base to resolve against and the installed app ends up pointing nowhere
  const here = location.protocol.startsWith("http") ? location.href.split(/[?#]/)[0] : ".";
  const dir = here === "." ? "." : new URL("./", here).href;
  const manifest = {
    name: "kanban", short_name: "kanban", description: "boards, columns, tasks",
    start_url: here, scope: dir, display: "standalone", orientation: "any",
    background_color: "#0e1013", theme_color: "#111318",
    icons: [
      { src: iconUrl, sizes: "any", type: "image/svg+xml", purpose: "any" },
      { src: iconUrl, sizes: "any", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const add = (rel, href, type) => {
    const l = document.createElement("link");
    l.rel = rel; l.href = href;
    if (type) l.type = type;
    document.head.appendChild(l);
  };
  add("icon", iconUrl, "image/svg+xml");
  add("apple-touch-icon", iconUrl);
  add("manifest", "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest)));
})();
</script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --card:#fff; --line:#e3e6ea; --text:#15181d;
    --muted:#6b7280; --accent:#2f6fed; --high:#e5484d; --medium:#e08b1a; --low:#2f9e5f;
    --shadow:0 1px 2px rgba(15,20,30,.08),0 4px 12px rgba(15,20,30,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1013; --panel:#151920; --card:#1a1f27; --line:#262c36; --text:#e8ebf0;
      --muted:#98a1b0; --accent:#5b8dff; --high:#ff6369; --medium:#f5a524; --low:#3fbf74;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); overscroll-behavior-y:contain;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--panel);
    border-bottom:1px solid var(--line); padding:env(safe-area-inset-top) 0 0;
  }
  .bar{display:flex; align-items:center; gap:10px; padding:10px 12px 6px}
  .bar h1{font-size:17px; margin:0; letter-spacing:-.2px}
  .bar .spacer{flex:1}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--text); border-radius:9px;
    width:34px; height:34px; font-size:17px; line-height:1; cursor:pointer;
  }
  .boards{display:flex; gap:8px; overflow-x:auto; padding:0 12px 10px; scrollbar-width:none}
  .boards::-webkit-scrollbar{display:none}
  .warn{margin:0; padding:8px 12px; background:var(--high); color:#fff; font-size:12px}
  .chip{
    flex:0 0 auto; padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:14px; font-weight:500; cursor:pointer;
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.add{color:var(--accent); font-weight:600}

  main{padding:14px 12px 96px; display:grid; gap:14px}
  @media (min-width:820px){ main{grid-template-columns:repeat(3,1fr); align-items:start} }

  .col{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px}
  .col.over{border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
  .col h2{
    margin:0 0 10px; font-size:12px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); display:flex; gap:8px; align-items:center;
  }
  .count{background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px}
  .empty{color:var(--muted); font-size:13px; padding:10px 2px 4px}

  .card{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--pri);
    border-radius:11px; padding:10px 10px 10px 12px; margin-bottom:9px; box-shadow:var(--shadow);
    display:flex; gap:8px; align-items:flex-start;
  }
  .card[data-pri=high]{--pri:var(--high)} .card[data-pri=medium]{--pri:var(--medium)}
  .card[data-pri=low]{--pri:var(--low)}
  .card .body{flex:1; min-width:0; cursor:pointer}
  .card .title{word-wrap:break-word}
  .tag{
    display:inline-block; margin-top:7px; font-size:11px; font-weight:600; letter-spacing:.04em;
    text-transform:uppercase; color:var(--pri); border:1px solid var(--pri); border-radius:999px; padding:1px 8px;
  }
  .handle{
    touch-action:none; cursor:grab; color:var(--muted); font-size:16px; padding:2px 4px;
    user-select:none; -webkit-user-select:none;
  }
  .moves{display:flex; flex-direction:column; gap:4px}
  .moves button{
    background:var(--bg); border:1px solid var(--line); color:var(--muted); border-radius:7px;
    width:26px; height:22px; font-size:12px; line-height:1; cursor:pointer;
  }
  .moves button:disabled{opacity:.25}
  .ghost{
    position:fixed; z-index:60; pointer-events:none; width:var(--w); opacity:.95;
    transform:rotate(1.5deg); box-shadow:0 12px 28px rgba(0,0,0,.32);
  }
  .dragging{opacity:.35}

  .fab{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:30;
    width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:28px; line-height:1; box-shadow:0 8px 22px rgba(47,111,237,.42); cursor:pointer;
  }

  dialog{
    border:none; border-radius:16px 16px 0 0; padding:0; width:100%; max-width:460px;
    margin:auto auto 0; background:var(--panel); color:var(--text);
  }
  @media (min-width:560px){ dialog{border-radius:16px; margin:auto} }
  dialog::backdrop{background:rgba(0,0,0,.45)}
  form{padding:18px 16px calc(18px + env(safe-area-inset-bottom)); display:grid; gap:14px}
  form h3{margin:0; font-size:16px}
  label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}
  input[type=text],select{
    width:100%; padding:11px 12px; font-size:16px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text);
  }
  .seg{display:flex; gap:8px}
  .seg button{
    flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer;
  }
  .seg button.on[data-v=high]{background:var(--high); border-color:var(--high); color:#fff}
  .seg button.on[data-v=medium]{background:var(--medium); border-color:var(--medium); color:#fff}
  .seg button.on[data-v=low]{background:var(--low); border-color:var(--low); color:#fff}
  .row{display:flex; gap:10px}
  .row button{flex:1; padding:12px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer}
  .primary{background:var(--accent); border:1px solid var(--accent); color:#fff}
  .ghost-btn{background:transparent; border:1px solid var(--line); color:var(--text)}
  .danger{background:transparent; border:1px solid var(--high); color:var(--high)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="boardTitle">kanban</h1>
    <span class="spacer"></span>
    <button class="icon-btn" id="boardMenu" title="board options">&#8942;</button>
  </div>
  <div class="boards" id="boardBar"></div>
</header>

<main id="cols"></main>
<button class="fab" id="fab" aria-label="new task">+</button>

<dialog id="taskSheet">
  <form method="dialog" id="taskForm">
    <h3 id="taskHeading">new task</h3>
    <div>
      <label for="title">title</label>
      <input type="text" id="title" autocomplete="off" placeholder="what needs doing" required>
    </div>
    <div>
      <label>priority</label>
      <div class="seg" id="priSeg">
        <button type="button" data-v="high">high</button>
        <button type="button" data-v="medium">medium</button>
        <button type="button" data-v="low">low</button>
      </div>
    </div>
    <div>
      <label for="status">column</label>
      <select id="status"></select>
    </div>
    <div class="row">
      <button type="button" class="ghost-btn" id="taskCancel">cancel</button>
      <button type="button" class="primary" id="taskSave">save</button>
    </div>
    <button type="button" class="danger" id="taskDelete" style="display:none">delete task</button>
  </form>
</dialog>

<dialog id="boardSheet">
  <form method="dialog">
    <h3 id="boardHeading">board</h3>
    <div>
      <label for="boardName">name</label>
      <input type="text" id="boardName" autocomplete="off" placeholder="work" required>
    </div>
    <div class="row">
      <button type="button" class="ghost-btn" id="boardCancel">cancel</button>
      <button type="button" class="primary" id="boardSave">save</button>
    </div>
    <button type="button" class="danger" id="boardDelete" style="display:none">delete board</button>
    <div>
      <label>backup</label>
      <div class="row">
        <button type="button" class="ghost-btn" id="exportBtn">export json</button>
        <button type="button" class="ghost-btn" id="importBtn">import json</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </form>
</dialog>

<script>
const COLS = [["inprogress","In Progress"],["todo","To Do"],["done","Done"]];
const KEY = "kanban.v1";
const $ = (s, r) => (r || document).querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => s.replace(/[&<>"']/g, c => ("&#" + c.charCodeAt(0) + ";"));

const seed = () => ({
  active: "personal",
  boards: [
    { id: "personal", name: "Personal", tasks: [] },
    { id: uid(), name: "Work", tasks: [] },
    { id: uid(), name: "Chores", tasks: [] }
  ]
});

let state = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.boards) && s.boards.length) return s;
    }
  } catch (e) { /* corrupt storage, start clean */ }
  return seed();
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    // some browsers block storage on file:// or in private mode. keep working in
    // memory and say so once, so nobody loses a board thinking it was saved
    if (!save.warned) {
      save.warned = true;
      const bar = document.createElement("p");
      bar.className = "warn";
      bar.textContent = "this browser will not save to disk here, changes vanish on reload. export a backup.";
      document.querySelector("header").appendChild(bar);
    }
  }
}
function board() { return state.boards.find(b => b.id === state.active) || state.boards[0]; }

const boardBar = $("#boardBar"), cols = $("#cols");

function render() {
  const b = board();
  state.active = b.id;
  $("#boardTitle").textContent = b.name;
  boardBar.innerHTML =
    state.boards.map(x =>
      '<button class="chip' + (x.id === b.id ? ' on' : '') + '" data-board="' + x.id + '">' +
      esc(x.name) + '</button>').join('') +
    '<button class="chip add" data-new-board="1">+ board</button>';

  cols.innerHTML = COLS.map(function (pair, i) {
    const id = pair[0], label = pair[1];
    const list = b.tasks.filter(t => t.status === id);
    const cards = list.map(t =>
      '<article class="card" data-id="' + t.id + '" data-pri="' + t.priority + '">' +
        '<span class="handle" data-drag="' + t.id + '">&#8942;&#8942;</span>' +
        '<div class="body" data-edit="' + t.id + '">' +
          '<div class="title">' + esc(t.title) + '</div>' +
          '<span class="tag">' + t.priority + '</span>' +
        '</div>' +
        '<div class="moves">' +
          '<button data-move="' + t.id + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + '>&#8592;</button>' +
          '<button data-move="' + t.id + '" data-dir="1"' + (i === COLS.length - 1 ? ' disabled' : '') + '>&#8594;</button>' +
        '</div>' +
      '</article>').join('');
    return '<section class="col" data-col="' + id + '">' +
      '<h2>' + label + '<span class="count">' + list.length + '</span></h2>' +
      (cards || '<p class="empty">nothing here yet</p>') +
      '</section>';
  }).join('');
  save();
}

/* ---------- task crud ---------- */
const taskSheet = $("#taskSheet"), statusSel = $("#status");
statusSel.innerHTML = COLS.map(p => '<option value="' + p[0] + '">' + p[1] + '</option>').join('');
let editingId = null, priority = "medium";

function setPriority(v) {
  priority = v;
  Array.from($("#priSeg").children).forEach(btn => btn.classList.toggle("on", btn.dataset.v === v));
}
$("#priSeg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-v]");
  if (btn) setPriority(btn.dataset.v);
});

function openTask(id, statusHint) {
  editingId = id || null;
  const t = id ? board().tasks.find(x => x.id === id) : null;
  $("#taskHeading").textContent = t ? "edit task" : "new task";
  $("#title").value = t ? t.title : "";
  setPriority(t ? t.priority : "medium");
  statusSel.value = t ? t.status : (statusHint || "todo");
  $("#taskDelete").style.display = t ? "block" : "none";
  taskSheet.showModal();
  if (!t) $("#title").focus();
}

$("#taskSave").addEventListener("click", () => {
  const title = $("#title").value.trim();
  if (!title) { $("#title").focus(); return; }
  const b = board();
  if (editingId) {
    const t = b.tasks.find(x => x.id === editingId);
    t.title = title; t.priority = priority; t.status = statusSel.value;
  } else {
    b.tasks.push({ id: uid(), title: title, priority: priority, status: statusSel.value });
  }
  taskSheet.close(); render();
});
$("#taskDelete").addEventListener("click", () => {
  const b = board();
  b.tasks = b.tasks.filter(t => t.id !== editingId);
  taskSheet.close(); render();
});
$("#taskCancel").addEventListener("click", () => taskSheet.close());
$("#fab").addEventListener("click", () => openTask(null, "todo"));

cols.addEventListener("click", e => {
  const edit = e.target.closest("[data-edit]");
  if (edit) return openTask(edit.dataset.edit);
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const t = board().tasks.find(x => x.id === mv.dataset.move);
    const at = COLS.findIndex(p => p[0] === t.status) + Number(mv.dataset.dir);
    if (COLS[at]) { t.status = COLS[at][0]; render(); }
  }
});

/* ---------- boards ---------- */
const boardSheet = $("#boardSheet");
let editingBoard = null;

function openBoard(id) {
  editingBoard = id || null;
  const b = id ? state.boards.find(x => x.id === id) : null;
  $("#boardHeading").textContent = b ? "edit board" : "new board";
  $("#boardName").value = b ? b.name : "";
  $("#boardDelete").style.display = b && state.boards.length > 1 ? "block" : "none";
  boardSheet.showModal();
  if (!b) $("#boardName").focus();
}
$("#boardSave").addEventListener("click", () => {
  const name = $("#boardName").value.trim();
  if (!name) { $("#boardName").focus(); return; }
  if (editingBoard) {
    state.boards.find(b => b.id === editingBoard).name = name;
  } else {
    const b = { id: uid(), name: name, tasks: [] };
    state.boards.push(b); state.active = b.id;
  }
  boardSheet.close(); render();
});
$("#boardDelete").addEventListener("click", () => {
  state.boards = state.boards.filter(b => b.id !== editingBoard);
  if (state.active === editingBoard) state.active = state.boards[0].id;
  boardSheet.close(); render();
});
$("#boardCancel").addEventListener("click", () => boardSheet.close());

$("#exportBtn").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "kanban-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || !Array.isArray(s.boards) || !s.boards.length) throw new Error("no boards in that file");
      state = s;
      if (!state.boards.some(b => b.id === state.active)) state.active = state.boards[0].id;
      boardSheet.close();
      render();
    } catch (err) {
      alert("could not read that file: " + err.message);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});
$("#boardMenu").addEventListener("click", () => openBoard(state.active));
boardBar.addEventListener("click", e => {
  const chip = e.target.closest("[data-board]");
  if (chip) { state.active = chip.dataset.board; return render(); }
  if (e.target.closest("[data-new-board]")) openBoard(null);
});

/* ---------- drag, pointer events so touch and mouse take the same path ---------- */
let drag = null;

cols.addEventListener("pointerdown", e => {
  const handle = e.target.closest("[data-drag]");
  if (!handle) return;
  const card = handle.closest(".card");
  const box = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.className = "card ghost";
  ghost.style.setProperty("--w", box.width + "px");
  ghost.style.left = box.left + "px";
  ghost.style.top = box.top + "px";
  document.body.appendChild(ghost);
  card.classList.add("dragging");
  drag = { id: handle.dataset.drag, ghost: ghost, card: card, dx: e.clientX - box.left, dy: e.clientY - box.top };
  handle.setPointerCapture(e.pointerId);
  e.preventDefault();
});

cols.addEventListener("pointermove", e => {
  if (!drag) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + "px";
  drag.ghost.style.top = (e.clientY - drag.dy) + "px";
  drag.ghost.style.display = "none";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.ghost.style.display = "";
  const col = under && under.closest ? under.closest(".col") : null;
  document.querySelectorAll(".col").forEach(c => c.classList.toggle("over", c === col));
  drag.target = col;
});

function endDrag() {
  if (!drag) return;
  const t = board().tasks.find(x => x.id === drag.id);
  if (drag.target && t) t.status = drag.target.dataset.col;
  drag.ghost.remove();
  drag.card.classList.remove("dragging");
  document.querySelectorAll(".col").forEach(c => c.classList.remove("over"));
  drag = null;
  render();
}
cols.addEventListener("pointerup", endDrag);
cols.addEventListener("pointercancel", endDrag);

render();

// sw.js only exists when the folder is served. on file:// this is skipped, the app still
// works, it just cannot be installed as a standalone app from there
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
