<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>t1ssuepap3r</title>
<style>
  :root{ --bg:#f4f1ea; --ink:#1a1a1a; --muted:#8a8577; --link:#3a6ea5; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:auto}
  #status{position:fixed;top:10px;right:14px;font-size:.75rem;color:var(--muted);z-index:10}
  #wall{position:relative;width:100%;min-height:100vh;min-width:100vw;cursor:crosshair}
  .block{position:absolute;min-width:20px;min-height:1.4em;outline:none;
    font-size:1.05rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-width:80vw}
  .block.sized{max-width:none;overflow-wrap:anywhere}
  #draw{position:absolute;border:1px dashed var(--muted);background:rgba(0,0,0,.03);pointer-events:none;z-index:5}
  .block a{color:var(--link);text-decoration:underline}
  .block.md{white-space:normal}
  .block.md > :first-child{margin-top:0}
  .block.md > :last-child{margin-bottom:0}
  .block.md p,.block.md ul,.block.md ol,.block.md pre,.block.md blockquote,.block.md table{margin:.4em 0}
  .block.md h1,.block.md h2,.block.md h3,.block.md h4{margin:.5em 0 .3em;line-height:1.25}
  .block.md ul,.block.md ol{padding-left:1.4em}
  .block.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
    background:rgba(0,0,0,.06);padding:.1em .3em;border-radius:3px}
  .block.md pre{background:rgba(0,0,0,.06);padding:.5em .7em;border-radius:4px;overflow:auto}
  .block.md pre code{background:none;padding:0}
  .block.md blockquote{border-left:3px solid var(--muted);padding-left:.7em;color:var(--muted)}
  .block.md img{max-width:100%}
  .block.md table{border-collapse:collapse}
  .block.md th,.block.md td{border:1px solid var(--muted);padding:.2em .5em}
  .block.md hr{border:none;border-top:1px solid var(--muted)}
</style>
</head>
<body>
<div id="status"></div>
<div id="wall"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
const SUPABASE_URL = "https://tegbmtgkpxyouorazpxr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlZ2JtdGdrcHh5b3VvcmF6cHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyMDksImV4cCI6MjEwNDY0MzIwOX0.Sj3rfYt5iJRF9V4--mFB-L3GO0dY1Ift8LEOW2hV_Bo";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const wall = document.getElementById('wall');
const status = document.getElementById('status');
let blocks = [];
let saveTimer = null;

const URL_RE = /(https?:\/\/[^\s]+)/g;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function linkify(text) {
  return escapeHtml(text).replace(URL_RE, url => {
    return `<a href="${url}" target="_blank" rel="noopener">${shortUrl(url)}</a>`;
  });
}

function shortUrl(url) {
  return url.length > 8 ? url.slice(0, 8) + '..' : url;
}

// Markdown (GFM, single newlines -> <br>) with inline HTML allowed, sanitized.
function renderMarkdown(text) {
  if (!window.marked || !window.DOMPurify) return null;
  const html = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('a[href]').forEach(a => {
    a.target = '_blank';
    a.rel = 'noopener';
    // keep the old behavior of shortening bare URLs
    if (a.textContent === a.getAttribute('href')) a.textContent = shortUrl(a.textContent);
  });
  return tmp.innerHTML;
}

function renderBlockContent(el, block, editing) {
  if (editing) {
    el.classList.remove('md');
    el.textContent = block.text;
    return;
  }
  const html = renderMarkdown(block.text);
  if (html === null) {
    el.classList.remove('md');
    el.innerHTML = linkify(block.text);
  } else {
    el.classList.add('md');
    el.innerHTML = html;
  }
}

function makeBlockEl(block) {
  const el = document.createElement('div');
  el.className = 'block';
  el.contentEditable = 'true';
  el.style.left = block.x + 'px';
  el.style.top = block.y + 'px';
  if (block.w) {
    el.classList.add('sized');
    el.style.width = block.w + 'px';
    if (block.h) el.style.minHeight = block.h + 'px';
  }
  renderBlockContent(el, block, false);

  el.addEventListener('focus', () => renderBlockContent(el, block, true));
  el.addEventListener('blur', () => {
    block.text = el.textContent;
    if (block.text.trim() === '') {
      blocks = blocks.filter(b => b !== block);
      el.remove();
    } else {
      renderBlockContent(el, block, false);
    }
    queueSave();
  });
  el.addEventListener('input', () => {
    block.text = el.textContent;
    queueSave();
  });
  el.addEventListener('click', e => e.stopPropagation());
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const sel = window.getSelection();
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const nl = document.createTextNode('\n');
      range.insertNode(nl);
      range.setStartAfter(nl);
      range.setEndAfter(nl);
      sel.removeAllRanges();
      sel.addRange(range);
      block.text = el.textContent;
      queueSave();
    }
  });

  block.el = el;
  wall.appendChild(el);
  return el;
}

function addBlock(x, y, w, h) {
  const block = { id: Date.now() + Math.random(), x, y, text: '' };
  // w/h are session-only (not part of the saved payload)
  if (w) { block.w = w; block.h = h; }
  blocks.push(block);
  makeBlockEl(block).focus();
}

// Drag on empty space to draw a temporary box; the box disappears on release
// and a text block (fixed width, wrapping, growing downward) takes its place.
let drag = null;
let lastPointerType = 'mouse';

wall.addEventListener('pointerdown', e => {
  lastPointerType = e.pointerType;
  if (e.target !== wall || e.button !== 0 || e.pointerType === 'touch') return;
  e.preventDefault();
  const guide = document.createElement('div');
  guide.id = 'draw';
  wall.appendChild(guide);
  drag = { x0: e.pageX, y0: e.pageY, guide, x: e.pageX, y: e.pageY, w: 0, h: 0 };
  wall.setPointerCapture(e.pointerId);
});

wall.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.x = Math.min(drag.x0, e.pageX);
  drag.y = Math.min(drag.y0, e.pageY);
  drag.w = Math.abs(e.pageX - drag.x0);
  drag.h = Math.abs(e.pageY - drag.y0);
  Object.assign(drag.guide.style, {
    left: drag.x + 'px', top: drag.y + 'px', width: drag.w + 'px', height: drag.h + 'px'
  });
});

function endDrag(e, commit) {
  if (!drag) return;
  const d = drag;
  drag = null;
  d.guide.remove();
  if (commit && d.w >= 30 && d.h >= 12) addBlock(d.x, d.y, d.w, d.h);
}
wall.addEventListener('pointerup', e => endDrag(e, true));
wall.addEventListener('pointercancel', e => endDrag(e, false));

// Touch can't drag-draw without blocking scroll, so tap still places a block.
wall.addEventListener('click', e => {
  if (e.target !== wall || lastPointerType !== 'touch') return;
  addBlock(e.pageX, e.pageY);
});

function queueSave() {
  clearTimeout(saveTimer);
  status.textContent = 'saving...';
  saveTimer = setTimeout(save, 800);
}

async function save() {
  const payload = JSON.stringify(blocks.map(b => ({ id: b.id, x: b.x, y: b.y, text: b.text })));
  const { error } = await sb.from('scratchpad')
    .update({ content: payload, updated_at: new Date().toISOString() })
    .eq('id', 'main');
  status.textContent = error ? 'save failed' : 'saved';
  if (!error) setTimeout(() => { if (status.textContent === 'saved') status.textContent = ''; }, 1500);
}

async function load() {
  const { data, error } = await sb.from('scratchpad').select('content').eq('id', 'main').single();
  if (error) { status.textContent = 'load failed'; return; }
  let parsed = [];
  try { parsed = JSON.parse(data.content || '[]'); } catch (e) { parsed = []; }
  blocks = parsed;
  blocks.forEach(b => makeBlockEl(b));
  status.textContent = '';
}

load();
</script>
</body>
</html>
