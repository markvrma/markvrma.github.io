<!-- Braille-dot spiral field behind the page. Pure text: every frame is a grid of
     U+28xx braille characters, so the "canvas" is a <pre> and the art is real ASCII
     (well, Unicode) rather than pixels. -->
<div class="braille-bg" aria-hidden="true"><pre id="braille-bg"></pre></div>

<style>
  .braille-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    /* Low enough that body text stays comfortably readable on top of it. */
    opacity: 0.16;
    color: #1c1b17;
  }

  .braille-bg pre {
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    font-family: "Menlo", "DejaVu Sans Mono", "Segoe UI Symbol", monospace;
    font-size: 13px;
    line-height: 1;
    letter-spacing: 0;
    white-space: pre;
    overflow: hidden;
    user-select: none;
  }
</style>

<script>
  (function () {
    var pre = document.getElementById('braille-bg');
    if (!pre) return;

    // Braille cells are 2 dots wide by 4 tall. Bit order is the Unicode one:
    // dots 1,2,3 down the left column, 4,5,6 down the right, then 7 and 8.
    var DOT_BITS = [
      [0, 0, 0x01], [0, 1, 0x02], [0, 2, 0x04], [0, 3, 0x40],
      [1, 0, 0x08], [1, 1, 0x10], [1, 2, 0x20], [1, 3, 0x80]
    ];

    var ARMS = 4;
    var STEPS = 900;

    var cols = 0, rows = 0, dotW = 0, dotH = 0, dots = null;
    var charW = 0, charH = 0;

    // Measure one character rather than guessing: font metrics vary per platform,
    // and a wrong cell size shears the whole spiral.
    function measure() {
      var probe = document.createElement('span');
      probe.textContent = '⣿'.repeat(50);
      probe.style.cssText =
        'position:absolute;visibility:hidden;white-space:pre;font:' +
        getComputedStyle(pre).font;
      document.body.appendChild(probe);
      var rect = probe.getBoundingClientRect();
      charW = rect.width / 50;
      charH = rect.height;
      document.body.removeChild(probe);
      if (!charW || !charH) { charW = 8; charH = 13; }
    }

    function resize() {
      measure();
      cols = Math.ceil(window.innerWidth / charW) + 1;
      rows = Math.ceil(window.innerHeight / charH) + 1;
      dotW = cols * 2;
      dotH = rows * 4;
      dots = new Uint8Array(dotW * dotH);
    }

    // Stamp a filled disc so the strokes have some weight to them -- a one-dot
    // line reads as noise at this opacity.
    function stamp(cx, cy, radius) {
      var r = Math.ceil(radius);
      var x0 = Math.max(0, Math.floor(cx) - r), x1 = Math.min(dotW - 1, Math.floor(cx) + r);
      var y0 = Math.max(0, Math.floor(cy) - r), y1 = Math.min(dotH - 1, Math.floor(cy) + r);
      var rr = radius * radius;
      for (var y = y0; y <= y1; y++) {
        var dy = y - cy;
        for (var x = x0; x <= x1; x++) {
          var dx = x - cx;
          if (dx * dx + dy * dy <= rr) dots[y * dotW + x] = 1;
        }
      }
    }

    function draw(time) {
      dots.fill(0);

      var cx = dotW / 2;
      var cy = dotH / 2;
      // Dots are not square on screen, so squash y to keep circles circular.
      var yScale = (charW / 2) / (charH / 4);
      var maxR = Math.max(dotW, dotH / yScale) * 0.52;

      // The coil count breathes: high means tightly wound, low means the arms
      // unwind almost straight. That slow swing is the spiral/unspiral.
      var coil = 2.6 + 1.9 * Math.sin(time * 0.16);
      var spin = time * 0.11;

      for (var a = 0; a < ARMS; a++) {
        var phase = (a * Math.PI * 2) / ARMS;
        for (var s = 0; s <= STEPS; s++) {
          var t = s / STEPS;

          // Squiggle: wobble the radius and nudge the angle, both drifting in time.
          var wobble = 0.085 * Math.sin(t * 9.0 + time * 0.9 + a * 1.7)
                     + 0.045 * Math.sin(t * 21.0 - time * 0.5);
          var r = (t + wobble) * maxR;
          var theta = phase + spin + t * coil * Math.PI * 2
                    + 0.13 * Math.sin(t * 6.0 - time * 0.7 + a);

          var x = cx + r * Math.cos(theta);
          var y = cy + r * Math.sin(theta) * yScale;
          if (x < -8 || x > dotW + 8 || y < -8 || y > dotH + 8) continue;

          // Fattest through the middle of each arm, tapering at both ends.
          stamp(x, y, 1.8 + 3.4 * Math.sin(Math.PI * t));
        }
      }

      render();
    }

    function render() {
      var out = '';
      for (var row = 0; row < rows; row++) {
        var line = '';
        for (var col = 0; col < cols; col++) {
          var bits = 0;
          for (var d = 0; d < 8; d++) {
            var dx = DOT_BITS[d][0], dy = DOT_BITS[d][1];
            if (dots[(row * 4 + dy) * dotW + (col * 2 + dx)]) bits |= DOT_BITS[d][2];
          }
          line += String.fromCharCode(0x2800 + bits);
        }
        out += line + '\n';
      }
      pre.textContent = out;
    }

    var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var timer = null;

    function loop(now) {
      if (document.hidden) return; // resumes on visibilitychange
      draw(now / 1000);
      // ~14fps. The motion is slow by design, and this leaves the main thread alone.
      timer = window.setTimeout(function () { requestAnimationFrame(loop); }, 70);
    }

    function start() {
      window.clearTimeout(timer);
      // Always paint one frame, even in a background tab: a page restored from
      // another tab should already have the field on it, not blank space.
      draw(performance.now() / 1000);
      if (still) return;
      requestAnimationFrame(loop);
    }

    var resizeTimer = null;
    window.addEventListener('resize', function () {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(function () { resize(); if (still) draw(0); }, 200);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) start();
    });

    resize();
    start();
  })();
</script>
