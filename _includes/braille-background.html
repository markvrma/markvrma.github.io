{% include base_path %}
<div class="braille-bg" aria-hidden="true"><pre id="braille-bg"></pre></div>

<style>
/* Inline, not in retro.css: the stylesheet is cached separately from the page,
   and a stale copy would leave this <pre> unstyled and in normal flow, dumping a
   wall of braille above the content. Shipping the rules with the markup keeps
   the two in step. Block comments survive the compress layout; // comments in
   JS do not, which is why the script is a separate file. */
.braille-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  /* Follows the theme toggle: --rt-ink flips with light and dark. */
  color: var(--rt-ink, #14120f);
  /* Judged against real body copy on the dark theme: at 0.12 the texture under
     the letters visibly flattens contrast, at 0.085 it does not. */
  opacity: 0.085;
}

.braille-bg pre {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font-family: "Menlo", "DejaVu Sans Mono", "Segoe UI Symbol", monospace;
  font-size: 13px;
  line-height: 1;
  letter-spacing: 0;
  white-space: pre;
  overflow: hidden;
  user-select: none;
}

/* Lift the page above the field. Only #main needs a position -- it is static,
   so z-index alone would do nothing. The masthead is already fixed and the
   footer already absolute (the theme's sticky-footer fix), and forcing either
   to relative drops it out of that layout and leaves dead scrollable space
   below the footer. */
.masthead,
.page__footer {
  z-index: 1;
}

#main {
  position: relative;
  z-index: 1;
}
</style>

<script src="{{ base_path }}/assets/js/braille-background.js" defer></script>
