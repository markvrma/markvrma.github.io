{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  var mvTheme = null;
  try { mvTheme = localStorage.getItem('theme'); } catch (e) {}
  /* Dark is the default. A stored choice wins; the system preference does not
     get a vote, so a first-time visitor always lands on the intended look.
     Block comment, not //: the compress layout puts this whole script on one
     line, and a line comment would swallow everything after it. */
  document.documentElement.setAttribute('data-theme', mvTheme || 'dark');
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
<!-- retro layer, loaded after main.css so it overrides the theme -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/retro.css">

<meta http-equiv="cleartype" content="on">
